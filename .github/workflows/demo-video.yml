name: Generate demo story video

on:
  workflow_dispatch:
    inputs:
      style:
        description: 'Image style'
        required: true
        default: 'cinematic'
        type: choice
        options: [cinematic, photorealistic, anime, storybook, 3d, watercolor, comic, minimalist]
      model:
        description: 'Pollinations model'
        required: true
        default: 'flux'
        type: choice
        options: [flux, flux-realism, flux-anime, flux-3d, turbo]
      ratio:
        description: 'Aspect ratio'
        required: true
        default: '9:16'
        type: choice
        options: ['9:16', '16:9', '1:1']
      extra:
        description: 'Extra style hint (e.g. warm sunset, 4k)'
        required: false
        default: ''
  push:
    branches:
      - claude/stick-figure-video-tool-3k6c3n
    paths:
      - 'pollinations_images.py'
      - '.github/workflows/demo-video.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Generate demo video
        env:
          STYLE: ${{ github.event.inputs.style || 'cinematic' }}
          MODEL: ${{ github.event.inputs.model || 'flux' }}
          RATIO: ${{ github.event.inputs.ratio || '9:16' }}
          EXTRA: ${{ github.event.inputs.extra || '' }}
        run: python .github/workflows/demo_run.py

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: demo-story-video
          path: |
            demo_out/story.mp4
            demo_out/*.jpg
          retention-days: 7
          if-no-files-found: error

      - name: Commit rendered video back to branch
        run: |
          set -e
          mkdir -p demos
          cp demo_out/story.mp4 "demos/story.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/story.mp4
          if git diff --cached --quiet; then
            echo "No change to commit"
          else
            git commit -m "demo(bot): refresh demos/story.mp4 from workflow run ${{ github.run_id }}"
            for i in 1 2 3 4; do
              if git push origin HEAD:${{ github.ref_name }}; then
                break
              fi
              echo "push retry $i"
              sleep $((2 ** i))
              git pull --rebase origin ${{ github.ref_name }} || true
            done
          fi

      - name: Print job summary
        run: |
          echo "## Demo video ready" >> $GITHUB_STEP_SUMMARY
          echo "Style: ${{ github.event.inputs.style || 'cinematic' }} | Model: ${{ github.event.inputs.model || 'flux' }} | Ratio: ${{ github.event.inputs.ratio || '9:16' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Committed to \`demos/story.mp4\` on this branch; also uploaded as the \`demo-story-video\` artifact." >> $GITHUB_STEP_SUMMARY
