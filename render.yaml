services:
  - type: web
    name: smart-video-assembler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: FREE_RENDER_MAX_CUES
        value: "30"
      - key: AI_RENDER_MAX_CUES
        value: "30"
